[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-cli"
version = "0.1.0"
description = "Local microphone recording and Japanese transcription CLI"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "openai-whisper",
    "sounddevice",
]

[project.scripts]
meeting-cli = "meeting_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
